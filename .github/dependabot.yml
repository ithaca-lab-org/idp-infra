version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /envs/persistent
      - /envs/dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      terraform:
        patterns: ["*"]
