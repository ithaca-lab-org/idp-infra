name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.13"
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: |
          for d in bootstrap envs/dev; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
      - name: tflint
        run: |
          tflint --init
          tflint --recursive
      - uses: bridgecrewio/checkov-action@a76233b2c1d4a820a9dc68be350c473a4a9dceec # v12.3130.0
        with:
          config_file: .checkov.yaml

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  plan:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
      - name: plan envs/dev
        working-directory: envs/dev
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
      - name: comment plan
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const p = 'envs/dev/plan.txt';
            const body = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'plan did not produce output';
            const trimmed = body.length > 60000 ? body.slice(-60000) : body;
            const marker = '<!-- terraform-plan-envs-dev -->';
            const text = marker + '\n### terraform plan (envs/dev)\n```\n' + trimmed + '\n```';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.startsWith(marker));
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body: text });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: text });
            }
