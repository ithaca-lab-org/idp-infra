name: apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:

permissions: {}

# One apply at a time; never cancel a running apply.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The apply SA's WIF binding only trusts refs/heads/main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SA }}
      # envs/dev (network + GKE) is applied by a human with `make up` so the
      # cluster never starts billing as a side effect of a merge.
      - name: apply envs/persistent
        working-directory: envs/persistent
        env:
          TF_VAR_billing_account_id: ${{ vars.BILLING_ACCOUNT_ID }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -lock-timeout=60s
